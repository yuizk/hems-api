name: Release
# Maintainer-triggered at a reviewed commit. The existing package stays private;
# public users build locally with compose.yaml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique image tag for this verified commit
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v && python -m ruff check .
      - name: Build once, smoke, verify identity, then publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          image_ref="ghcr.io/yuizk/hems-api:$RELEASE_TAG"
          docker build --no-cache -t "$image_ref" .
          built_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          [[ "$built_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          scripts/smoke-image.sh "$image_ref"
          smoked_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          [[ "$built_id" == "$smoked_id" ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$image_ref"
          repo_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_ref" | sed -n 's#^ghcr.io/yuizk/hems-api@\(sha256:[0-9a-f]\{64\}\)$#\1#p')"
          [[ "$repo_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'commit: %s\nimage ID: %s\nimage: %s@%s\n' "$GITHUB_SHA" "$built_id" "$image_ref" "$repo_digest" | tee -a "$GITHUB_STEP_SUMMARY"
